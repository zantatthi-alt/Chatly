# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: chatly
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Connection string of a PostgreSQL database (e.g. a free one from neon.tech).
      # Without it, accounts and messages are lost whenever the server restarts.
      - key: DATABASE_URL
        sync: false
